name: Apply EADDRINUSE Fix v2

on:
  push:
    branches:
      - main
    paths:
      - tools/fix_eaddrinuse_v2.py
      - .github/workflows/apply-eaddrinuse-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply lifecycle/init fix
        run: python3 tools/fix_eaddrinuse_v2.py

      - name: Validate diff
        run: |
          git diff --check
          git diff -- app/src/main/kotlin/com/github/digitallyrefined/androidipcamera/StreamingService.kt

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Test and build debug APK
        run: |
          ./gradlew clean test :app:assembleDebug \
            --no-daemon \
            --max-workers=1 \
            -Dorg.gradle.parallel=false

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-ip-camera-eaddrinuse-v2-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Commit verified v2 source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/github/digitallyrefined/androidipcamera/StreamingService.kt
          if git diff --cached --quiet; then
            echo "Source already patched"
            exit 0
          fi
          git commit -m "Fix orphan server listener across service lifecycle [skip ci]"
          git push origin HEAD:main
